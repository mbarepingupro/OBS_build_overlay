<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Village RPG - Level Up</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden;
    font-family: "Arial Narrow", "Liberation Sans Narrow", "Roboto Condensed", Arial, sans-serif; }

  #card {
    position: absolute; left: 50%; top: 45%;
    transform: translate(-50%, -50%) scale(.7);
    opacity: 0; text-align: center; white-space: nowrap;
  }
  #card.go { animation: pop 3.2s ease-out forwards; }
  @keyframes pop {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
    12%  { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
    20%  { transform: translate(-50%,-50%) scale(1); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-60%) scale(1); }
  }

  #tag {
    font-weight: 700; font-size: 26px; color: #ffd100; letter-spacing: .08em;
    text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
  }
  #line {
    font-weight: 700; font-size: 54px; color: #fff; margin-top: 4px;
    text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 22px rgba(255,209,0,.6);
  }
  #line b { color: #ffd100; }

  .spark {
    position: absolute; width: 8px; height: 8px; background: #ffd100; border-radius: 50%;
    animation: fly 1s ease-out forwards;
  }
  @keyframes fly {
    0%   { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); }
  }

  #dbg { position: absolute; left: 8px; top: 8px; padding: 6px 10px; background: #000; color: #0f0;
    font: 14px Arial; z-index: 9; max-width: 900px; white-space: pre-wrap; line-height: 1.4; }
</style>
</head>
<body>
<div id="card">
  <div id="tag">LEVEL UP</div>
  <div id="line"></div>
</div>

<script>
const q = new URLSearchParams(location.search);
const HOST = q.get("host") || "127.0.0.1";
const PORT = q.get("port") || "8080";

const card = document.getElementById("card");
const line = document.getElementById("line");
const dbg = q.get("debug") ? document.body.appendChild(document.createElement("div")) : null;
if (dbg) dbg.id = "dbg";
let dbgLines = [];
function status(t) {
  if (!dbg) return;
  dbgLines.push(t);
  if (dbgLines.length > 6) dbgLines.shift();
  dbg.textContent = dbgLines.join("\n");
}

function spawnSparks() {
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    const angle = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 90;
    s.style.setProperty("--dx", Math.cos(angle) * dist + "px");
    s.style.setProperty("--dy", Math.sin(angle) * dist + "px");
    s.style.left = "50%"; s.style.top = "55%";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

function onLevelUp(d) {
  line.innerHTML = "<b>" + d.user + "</b> reached Level " + d.level + "!";
  card.classList.remove("go"); void card.offsetWidth; card.classList.add("go");
  spawnSparks();
}

function handle(d) {
  if (d.event === "rpg_levelup") onLevelUp(d);
}

function connect() {
  status("Connecting to ws://" + HOST + ":" + PORT + " ...");
  const ws = new WebSocket("ws://" + HOST + ":" + PORT + "/");
  ws.onopen = () => {
    status("Connected, subscribing...");
    ws.send(JSON.stringify({ request: "Subscribe", id: "levelup-sub", events: { General: ["Custom"] } }));
    status("Connected to Streamer.bot");
  };
  ws.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      const d = (msg && msg.data && typeof msg.data === "object") ? msg.data : msg;
      if (d.event && String(d.event).indexOf("rpg_") === 0) status(">> EVENT: " + JSON.stringify(d).slice(0, 160));
      handle(d);
    } catch (_) {}
  };
  ws.onclose = () => { status("Disconnected, retrying..."); setTimeout(connect, 3000); };
  ws.onerror = () => ws.close();
}
connect();

if (q.get("test")) {
  let lvl = 4;
  setInterval(() => { lvl++; onLevelUp({ user: "PenguinTester", level: lvl }); }, 4000);
}
</script>
</body>
</html>
